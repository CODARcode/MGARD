syntax = "proto3";

package mgard.pb;

// The GNU C library defines macros `major` and `minor`.
message VersionNumber {
  uint64 major_ = 1;
  uint64 minor_ = 2;
  uint64 patch_ = 3;
}

message CartesianGridTopology {
  uint64 dimension = 1;
  repeated uint64 shape = 2;
}

message ExplicitCubeGeometry { repeated double coordinates = 2; }

message Domain {
  enum Topology { CARTESIAN_GRID = 0; }
  enum Geometry {
    UNIT_CUBE = 0;
    EXPLICIT_CUBE = 1;
  }

  Topology topology = 1;
  oneof topology_definition {
    CartesianGridTopology cartesian_grid_topology = 2;
  }

  Geometry geometry = 3;
  oneof geometry_definition {
    ExplicitCubeGeometry explicit_cube_geometry = 4;
    string explicit_cube_filename = 5;
  }
}

message Dataset {
  enum Type {
    FLOAT = 0;
    DOUBLE = 1;
  }

  Type type = 1;
  // In case we want to support vector-valued data in the future.
  uint64 dimension = 2;
}

message ErrorControl {
  enum Mode {
    ABSOLUTE = 0;
    RELATIVE = 1;
  }
  enum Norm {
    L_INFINITY = 0;
    S_NORM = 1;
  }

  Mode mode = 1;
  Norm norm = 2;
  // Only relevant when `error_norm == S_NORM`.
  double s = 3;
  // Only relevant when `error_mode == RELATIVE`.
  double norm_of_original_data = 4;
  double tolerance = 5;
}

message DomainDecomposition {
  enum Method {
    NOOP_METHOD = 0;
    MAX_DIMENSION = 1;
    BLOCK = 2;
    VARIABLE = 3;
  }

  Method method = 1;
  uint64 decomposition_dimension = 2;
  uint64 decomposition_size = 3;
}

// Per-block error tolerances for the region-of-interest (ROI) mode of the
// hybrid hierarchy. The tolerances are the level-0 block tolerances the
// compressor was given; the decompressor re-derives the deeper levels from
// them exactly as the compressor did, so only level 0 is stored.
//
// Block order is the local quantizer's: row-major over
// ceil(padded_shape[d] / local_block_size) for d = 0..dimension-1, with
// padded_shape[d] the shape rounded up to a multiple of local_block_size.
message RegionOfInterest {
  // Number of blocks along each dimension at level 0. Stored so the reader can
  // reject a tolerance map that does not match the grid it is applied to.
  repeated uint64 block_dimensions = 1;

  // ROI maps are piecewise constant in practice (a handful of distinct
  // tolerances over large runs of blocks), so the run-length form is usually
  // far smaller. The writer emits whichever encoding serializes smaller; both
  // decode to the same block_count-length tolerance vector.
  oneof encoding {
    PackedTolerances packed = 2;
    RunLengthTolerances run_length = 3;
  }
}

message PackedTolerances { repeated double tolerances = 1; }

message RunLengthTolerances {
  repeated double values = 1;
  repeated uint64 run_lengths = 2;
}

// Parameters of the hybrid (block-local + global) hierarchy, a.k.a. BlockMGARD.
// Required to reconstruct: the number of local/global levels determines the
// layout of the decomposed buffer and which (de)quantizers run, and the ROI
// tolerance map determines the per-block quantization step.
message HybridHierarchy {
  enum Projection {
    // Streams written before this field existed used the orthogonal basis.
    PROJECTION_UNSPECIFIED = 0;
    ORTHOGONAL = 1;
    HIERARCHICAL = 2;
  }
  // Number of block-local refactoring levels (Config::
  // num_local_refactoring_level, "L").
  uint64 num_local_levels = 1;
  // Number of global refactoring levels (Config::
  // num_global_refactoring_level, "M"). At least one of L and M is non-zero.
  uint64 num_global_levels = 2;
  // Edge length of the block-local transform block. Currently a compile-time
  // constant (8), recorded so a future change stays readable.
  uint64 local_block_size = 3;
  // Absent when ROI mode was disabled.
  RegionOfInterest region_of_interest = 4;
  // Resolved transform basis. This must be persisted because two L-infinity
  // streams may be produced with different user-selected projection modes.
  Projection projection = 5;
}

// MGARD-X cap on the number of decomposition levels. Levels are numbered from
// 0 (coarsest) to `max_level`, so the hierarchy has at most `max_level + 1`
// levels; a shape that does not support that many stops earlier.
message LevelCap {
  // Set when the writer did not cap the depth; `max_level` is then unused.
  bool unlimited = 1;
  uint64 max_level = 2;
}

message FunctionDecomposition {
  enum Transform { MULTILEVEL_COEFFICIENTS = 0; }
  enum Hierarchy {
    POWER_OF_TWO_PLUS_ONE = 0;
    MULTIDIMENSION_WITH_GHOST_NODES = 1;
    ONE_DIM_AT_A_TIME_WITH_GHOST_NODES = 2;
    HYBRID_HIERARCHY = 3;
  }

  Transform transform = 1;
  Hierarchy hierarchy = 2;
  // Currently only relevant when `hierarchy == GHOST_NODES`.
  uint64 L_target = 3;
  // Required when `hierarchy == HYBRID_HIERARCHY`, absent otherwise.
  HybridHierarchy hybrid_hierarchy = 4;
  // Cap on the decomposition depth the stream was written with (MGARD-X
  // `Config::max_larget_level`). The reader has to rebuild the hierarchy with
  // the same depth: the per-level quantization step and the number of
  // recomposition passes both depend on it. Absent from streams written before
  // it was recorded; those were decomposed to the full depth their shape allows
  // unless the writer capped it out of band, which a reader cannot detect.
  LevelCap level_cap = 5;
}

message Quantization {
  enum Method { NOOP_QUANTIZATION = 0;
                COEFFICIENTWISE_LINEAR = 1;
              }
  enum BinWidths {
    PER_COEFFICIENT = 0;
    PER_LEVEL = 1;
  }
  enum Type {
    INT8_T = 0;
    INT16_T = 1;
    INT32_T = 2;
    INT64_T = 3;
  }

  Method method = 1;
  BinWidths bin_widths = 2;
  Type type = 3;
  bool big_endian = 4;
}

message BitplaneEncoding {
  enum Method { NOOP_BITPLANE_ENCODING = 0;
                GROUPED_BITPLANE_ENCODING = 1;
              }
  enum Type {
    INT8_T = 0;
    INT16_T = 1;
    INT32_T = 2;
    INT64_T = 3;
  }
  Method method = 1;
  Type type = 2;
  uint64 number_bitplanes = 3;
  bool big_endian = 4;
}

message Encoding {
  enum Preprocessor {
    NOOP_PREPROCESSOR = 0;
    SHUFFLE = 1;
  }
  enum Compressor {
    NOOP_COMPRESSOR = 0;
    CPU_HUFFMAN_ZLIB = 1;
    CPU_HUFFMAN_ZSTD = 2;
    X_HUFFMAN = 3;
    X_HUFFMAN_LZ4 = 4; // Huffman + the portable (nvcomp-free) LZ4 backend
    X_HUFFMAN_ZSTD = 5;
    X_BLOCK_DELTA = 6;
    reserved 7;        // was X_HUFFMAN_LZ4_PORTABLE (folded into X_HUFFMAN_LZ4)
    X_LZ4 = 8;         // portable LZ4 directly on the quantized stream
    X_SYMBOL_RANS = 9; // symbol-alphabet rANS (outlier separation + rANS)
    X_ZERORLE_RANS = 10; // zero-RLE then byte-alphabet rANS
  }

  Preprocessor preprocessor = 1;
  Compressor compressor = 2;
  // Only relevant when `compressor == X_HUFFMAN` or `lossless_compressor ==
  // X_HUFFMAN_LZ4` or `compressor == X_HUFFMAN_ZSTD`
  uint64 huffman_dictionary_size = 3;
  uint64 huffman_block_size = 4;
  // Only relevant when `compressor == X_BLOCK_DELTA`
  uint64 block_delta_block_size = 5;
}

message Device {
  enum Backend {
    CPU = 0;
    X_SERIAL = 1;
    X_OPENMP = 2;
    X_CUDA = 3;
    X_HIP = 4;
    X_SYCL = 5;
  }

  Backend backend = 1;
}

message Header {
  // enum Structure {
  // 	TRANFORM_QUANTIZE_ENCODE = 0;
  // }

  // Structure structure = 1;
  VersionNumber mgard_version = 2;
  VersionNumber file_format_version = 3;
  Domain domain = 4;
  Dataset dataset = 5;
  ErrorControl error_control = 6;
  DomainDecomposition domain_decomposition = 7;
  FunctionDecomposition function_decomposition = 8;
  Quantization quantization = 9;
  BitplaneEncoding bitplane_encoding = 10;
  Encoding encoding = 11;
  Device device = 12;
}
